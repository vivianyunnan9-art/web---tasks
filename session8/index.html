<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cards</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="gray-c padding-top-bottom">

    <div class="container new-flex">

        <!-- Card 1 -->
        <div class="card">

            <img class="img-abs" src="ph s8/vi1.jfif" alt="Karan Singh">

            <div class="content">

                <h3>Karan Singh</h3>

                <p class="f-size">
                    Graphic Designer
                </p>

            </div>

        </div>


        <!-- Card 2 -->
        <div class="card">

            <img class="img-abs" src="ph s8/vi2.jfif" alt="Dolly Seth">

            <div class="content">

                <h3>Dolly Seth</h3>

                <p class="f-size">
                    Digital Marketing
                </p>

            </div>

        </div>


        <!-- Card 3 -->
        <div class="card">

            <img class="img-abs" src="ph s8/vi3.jfif" alt="Aakash Agrawal">

            <div class="content">

                <h3>Aakash Agrawal</h3>

                <p class="f-size">
                    Chartered Accountant C.A
                </p>

            </div>

        </div>

    </div>

</section>

</body>
</html>
