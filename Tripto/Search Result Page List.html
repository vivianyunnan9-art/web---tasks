<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripto — Search</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  /* --- Header --- */
  .logo-dot { color: #f59e0b; }
  .searchbar > * { border-left: 1px solid #dee2e6; }
  .searchbar > *:first-child { border-left: none; }
  .avatar-img { width: 34px; height: 34px; object-fit: cover; border-radius: 50%; }
  .flag-icon { width: 20px; height: 14px; object-fit: cover; border-radius: 2px; }

  /* --- Language/Currency modal --- */
  .lang-item.active { background: #eef4ff; border-radius: 6px; }
  .lang-item.active .check { display: inline-block; }
  .lang-item .check { display: none; color: #2f6fed; }

  /* --- Filters --- */
  .stars { color: #f59e0b; }
  .accordion-button { box-shadow: none !important; padding-left: 0; padding-right: 0; }
  .accordion-item { border: none; border-bottom: 1px solid #e5e7eb; }
  .accordion-body { padding-left: 0; padding-right: 0; }

  /* --- Results cards --- */
  .hotel-img { height: 200px; object-fit: cover; }
  .badge-corner { position: absolute; top: 10px; left: 10px; }
  .heart-btn {
    position: absolute; top: 8px; right: 8px;
    width: 30px; height: 30px; border-radius: 50%;
    background: #fff; border: none;
  }
  .heart-btn.liked { color: #dc3545; }
  .score-badge { background: #2f6fed; color: #fff; font-weight: 700; }
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<nav class="navbar bg-white border-bottom py-3">
  <div class="container-fluid px-4 d-flex justify-content-between align-items-center">

    <span class="fw-bold fs-4 text-primary">tript<span class="logo-dot">o</span></span>

    <div class="d-flex border rounded-pill overflow-hidden searchbar">
      <input class="form-control border-0" value="Barcelona" style="width:140px">
      <input type="date" class="form-control border-0" value="2026-08-14" style="width:150px">
      <input type="date" class="form-control border-0" value="2026-08-19" style="width:150px">
      <input class="form-control border-0" value="2 Guests" style="width:100px">
      <button class="btn btn-primary rounded-0 px-3"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <div class="d-flex align-items-center gap-3">
      <!-- زرار فتح مودال اللغة والعملة -->
      <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#langModal">
        <img src="https://flagcdn.com/w20/us.png" class="flag-icon"> EN / USD
      </button>

      <i class="fa-regular fa-bell fs-5"></i>

      <!-- حطي صورتك جوه مجلد images وسميها avatar.jpg -->
      <img src="impro/Avatar.png" class="avatar-img" alt="profile">
    </div>

  </div>
</nav>

<!-- ===== MODAL: Language & Currency ===== -->
<div class="modal fade" id="langModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header border-0 pb-0">
        <ul class="nav nav-tabs border-0" role="tablist">
          <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-lang" type="button">Languages</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-currency" type="button">Currency</button>
          </li>
        </ul>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="tab-content">

          <div class="tab-pane fade show active" id="tab-lang">
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" checked>
              <label class="form-check-label">Automatically translate descriptions and reviews into English</label>
            </div>
            <p class="fw-semibold small text-muted">Choose a language</p>
            <div class="row row-cols-4 g-2" id="langList"></div>
          </div>

          <div class="tab-pane fade" id="tab-currency">
            <p class="fw-semibold small text-muted">Choose a currency</p>
            <div class="row row-cols-4 g-2" id="currencyList"></div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- ===== BODY ===== -->
<div class="container my-4">
  <div class="row">

    <!-- ===== FILTERS ===== -->
    <aside class="col-lg-3">
      <div class="bg-white border rounded-3 p-3">

        <div class="d-flex justify-content-between mb-2">
          <h6 class="mb-0">Filter by</h6>
          <a href="#" class="small text-decoration-none">Clear</a>
        </div>

        <div class="accordion" id="filtersAccordion">

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#c1">Type of Place</button>
            </h2>
            <div id="c1" class="accordion-collapse collapse show" data-bs-parent="#filtersAccordion">
              <div class="accordion-body">
                <div class="btn-group btn-group-sm" role="group">
                  <input type="radio" class="btn-check" name="type" id="any" checked>
                  <label class="btn btn-outline-secondary" for="any">Any type</label>
                  <input type="radio" class="btn-check" name="type" id="room">
                  <label class="btn btn-outline-secondary" for="room">Room</label>
                  <input type="radio" class="btn-check" name="type" id="home">
                  <label class="btn btn-outline-secondary" for="home">Entire home</label>
                </div>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#c2">Price Range</button>
            </h2>
            <div id="c2" class="accordion-collapse collapse show" data-bs-parent="#filtersAccordion">
              <div class="accordion-body">
                <label class="form-label small text-muted">Nightly prices including fees and taxes</label>
                <input type="range" class="form-range" min="0" max="2000" value="200" id="priceRange">
                <div class="d-flex gap-2">
                  <input class="form-control form-control-sm" value="$200" id="minPrice" readonly>
                  <input class="form-control form-control-sm" value="$1,500+" id="maxPrice" readonly>
                </div>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#c3">Rooms and Beds</button>
            </h2>
            <div id="c3" class="accordion-collapse collapse" data-bs-parent="#filtersAccordion">
              <div class="accordion-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span>Bedrooms</span>
                  <div class="input-group input-group-sm" style="width:110px">
                    <button class="btn btn-outline-secondary">−</button>
                    <input class="form-control text-center" value="1">
                    <button class="btn btn-outline-secondary">+</button>
                  </div>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                  <span>Beds</span>
                  <div class="input-group input-group-sm" style="width:110px">
                    <button class="btn btn-outline-secondary">−</button>
                    <input class="form-control text-center" value="1">
                    <button class="btn btn-outline-secondary">+</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#c4">Guest Review Score</button>
            </h2>
            <div id="c4" class="accordion-collapse collapse show" data-bs-parent="#filtersAccordion">
              <div class="accordion-body">
                <div class="form-check"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">5.0 Excellent</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">4.0+ Very good</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">3.0+ Good</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label">2.0+ Fair</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label">&lt; 2.0 Poor</label></div>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#c5">Property Classification</button>
            </h2>
            <div id="c5" class="accordion-collapse collapse show" data-bs-parent="#filtersAccordion">
              <div class="accordion-body">
                <div class="form-check"><input class="form-check-input" type="checkbox" checked><label class="form-check-label"><span class="stars">★★★★★</span> 5-star</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" checked><label class="form-check-label"><span class="stars">★★★★</span>☆ 4-star</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" checked><label class="form-check-label"><span class="stars">★★★</span>☆☆ 3-star</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label"><span class="stars">★★</span>☆☆☆ 2-star</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label"><span class="stars">★</span>☆☆☆☆ 1-star</label></div>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#c6">Amenities</button>
            </h2>
            <div id="c6" class="accordion-collapse collapse show" data-bs-parent="#filtersAccordion">
              <div class="accordion-body">
                <p class="small text-muted mb-1">Popular</p>
                <div class="d-flex flex-wrap gap-2 mb-3">
                  <span class="badge rounded-pill text-bg-dark"><i class="fa-solid fa-wifi"></i> Wi-Fi</span>
                  <span class="badge rounded-pill text-bg-light border">Air Conditioning</span>
                  <span class="badge rounded-pill text-bg-light border">BBQ Grill</span>
                  <span class="badge rounded-pill text-bg-light border">TV</span>
                  <span class="badge rounded-pill text-bg-light border">Kitchen</span>
                </div>
                <p class="small text-muted mb-1">Essentials</p>
                <div class="d-flex flex-wrap gap-2">
                  <span class="badge rounded-pill text-bg-light border">Iron</span>
                  <span class="badge rounded-pill text-bg-light border">Hair Dryer</span>
                  <span class="badge rounded-pill text-bg-light border">Workspace</span>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </aside>

    <!-- ===== RESULTS ===== -->
    <main class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Explore 300+ Places in Barcelona</h4>
        <select class="form-select form-select-sm" style="width:auto">
          <option>Sort by: Top Reviewed</option>
          <option>Price: Low to High</option>
          <option>Price: High to Low</option>
        </select>
      </div>

      <div id="cards"></div>

      <nav>
        <ul class="pagination justify-content-center" id="pagination"></ul>
      </nav>
    </main>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
