<!DOCTYPE html>
<html>
<head>
    <title>table</title>
</head>
<body>

    <table border="1">
        <!-- الصف الأول -->
        <tr>
            <th rowspan="3">day</th>
            <th colspan="3">seminar</th>
        </tr>

        <!-- الصف الثاني -->
        <tr>
            <th colspan="2">schedule</th>
            <th rowspan="2">topic</th>
        </tr>

        <!-- الصف الثالث -->
        <tr>
            <th>begin</th>
            <th>end</th>
        </tr>
         
        <!-- monday -->
        <tr>
            <td rowspan="2">monday</td>
            <td rowspan="2">8:00 a.m.</td>
            <td rowspan="2">5:00 p.m.</td>
            <td>introduction to html</td> 
        </tr>
        <tr>
            <td>validity: dtd and relax ng</td>
        </tr>

        <!-- tuesday -->
        <tr>
            <td rowspan="3">tuesday</td>
            <td>8:00 a.m.</td>
            <td>11:00 a.m.</td>
            <td>xpath</td>
        </tr>
        <tr>
            <td>11:00 a.m.</td>
            <td>2:00 p.m.</td>
            <td rowspan="2">xsl transformation</td>
        </tr>
        <tr>
            <td>2:00 p.m.</td>
            <td>5:00 p.m.</td>
        </tr>

        <!-- wednesday -->
        <tr>
            <td>wednesday</td>
            <td>8:00 a.m.</td>
            <td>12:00 p.m.</td>
            <td>xsl formatting objects</td>
        </tr>
    </table>

</body>
</html>
