<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripto — Map View</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-light">

<!-- ===== HEADER ===== -->
<nav class="navbar bg-white border-bottom py-2">
  <div class="container-fluid px-4">
    <a href="index.html" class="navbar-brand fw-bold fs-4 text-primary text-decoration-none">tript<span class="text-danger">o</span></a>
    <div class="d-none d-md-flex border rounded-pill overflow-hidden bg-light">
      <input class="form-control border-0 bg-light" value="Barcelona" style="width:140px">
      <input class="form-control border-0 bg-light" value="14 Aug - 19 Aug" style="width:160px">
      <button class="btn btn-primary rounded-0 px-3"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-light btn-sm border" data-bs-toggle="modal" data-bs-target="#langModal">
        <img src="https://flagcdn.com/w20/us.png" class="rounded" style="width:20px"> USD
      </button>
      <img src="https://i.pravatar.cc/150?img=12" class="rounded-circle border" width="36" height="36" alt="profile">
    </div>
  </div>
</nav>

<!-- ===== MAP LAYOUT ===== -->
<div class="container-fluid p-0" style="height: calc(100vh - 64px);">
  <div class="row g-0 h-100">
    
    <!-- Sidebar: Hotel List -->
    <div class="col-md-4 col-lg-3 bg-white border-end overflow-auto h-100" id="sidebar">
      <div class="p-3 border-bottom sticky-top bg-white z-1">
        <div class="d-flex justify-content-between align-items-center">
          <h6 class="mb-0 fw-bold"><i class="fa-solid fa-bed text-primary me-2"></i>300+ places</h6>
          <button class="btn btn-sm btn-outline-secondary d-md-none" onclick="toggleSidebar()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
      
      <!-- Hotel Item 1 -->
      <div class="card border-0 border-bottom rounded-0 p-3" style="cursor:pointer" onclick="focusHotel(41.3888, 2.1950)">
        <div class="d-flex gap-3">
          <img src="https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=200" class="rounded-3 object-fit-cover" width="80" height="80" alt="Hotel">
          <div class="flex-grow-1">
            <h6 class="mb-1 fw-bold text-truncate">Hotel Arts Barcelona</h6>
            <div class="small text-muted mb-1"><i class="fa-solid fa-location-dot me-1"></i>Port Olimpic</div>
            <div class="text-warning small mb-1">★★★★★ <span class="text-dark fw-bold">5.0</span></div>
            <div class="fs-5 fw-bold text-primary">$1,500</div>
          </div>
        </div>
      </div>

      <!-- Hotel Item 2 -->
      <div class="card border-0 border-bottom rounded-0 p-3" style="cursor:pointer" onclick="focusHotel(41.3688, 2.1897)">
        <div class="d-flex gap-3">
          <img src="https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=200" class="rounded-3 object-fit-cover" width="80" height="80" alt="Hotel">
          <div class="flex-grow-1">
            <h6 class="mb-1 fw-bold text-truncate">W Barcelona</h6>
            <div class="small text-muted mb-1"><i class="fa-solid fa-location-dot me-1"></i>Barceloneta</div>
            <div class="text-warning small mb-1">★★★★★ <span class="text-dark fw-bold">5.0</span></div>
            <div class="fs-5 fw-bold text-primary">$1,395</div>
          </div>
        </div>
      </div>

      <!-- Hotel Item 3 -->
      <div class="card border-0 border-bottom rounded-0 p-3" style="cursor:pointer" onclick="focusHotel(41.3755, 2.1825)">
        <div class="d-flex gap-3">
          <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=200" class="rounded-3 object-fit-cover" width="80" height="80" alt="Hotel">
          <div class="flex-grow-1">
            <h6 class="mb-1 fw-bold text-truncate">Eurostars Grand Marina</h6>
            <div class="small text-muted mb-1"><i class="fa-solid fa-location-dot me-1"></i>Port Vell</div>
            <div class="text-warning small mb-1">★★★★ <span class="text-dark fw-bold">4.4</span></div>
            <div class="fs-5 fw-bold text-primary">$1,215</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Map Area -->
    <div class="col-md-8 col-lg-9 h-100 position-relative">
      <div id="map" class="h-100 w-100"></div>
      
      <button class="btn btn-primary shadow position-absolute bottom-0 end-0 m-4 rounded-pill px-4" onclick="window.location.href='search.html'">
        <i class="fa-solid fa-list me-2"></i> List View
      </button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', { zoomControl: false }).setView([41.3851, 2.1734], 13);
  L.control.zoom({ position: 'topright' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  const hotels = [
    { name: 'Hotel Arts Barcelona', lat: 41.3888, lng: 2.1950, price: '$1,500' },
    { name: 'W Barcelona', lat: 41.3688, lng: 2.1897, price: '$1,395' },
    { name: 'Eurostars Grand Marina', lat: 41.3755, lng: 2.1825, price: '$1,215' }
  ];

  hotels.forEach((hotel, index) => {
    const markerHtml = `<span class="badge bg-danger rounded-pill shadow-sm border border-white" style="font-size:14px; padding:8px 12px;">${hotel.price}</span>`;
    const customIcon = L.divIcon({
      html: markerHtml,
      className: 'bg-transparent border-0',
      iconSize: [60, 30],
      iconAnchor: [30, 30]
    });

    L.marker([hotel.lat, hotel.lng], { icon: customIcon })
      .addTo(map)
      .bindPopup(`<b>${hotel.name}</b><br>${hotel.price}`);
  });

  function focusHotel(lat, lng) {
    map.setView([lat, lng], 15);
    if (window.innerWidth < 768) {
      document.getElementById('sidebar').classList.add('d-none');
    }
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('d-none');
  }
</script>
</body>
</html>
