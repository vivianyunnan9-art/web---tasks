<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripto — Find Your Perfect Stay</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ===== LANDING PAGE ===== -->
<section class="d-flex flex-column align-items-center justify-content-center text-center" 
         style="min-height: 100vh; background: linear-gradient(135deg, #435fba 0%, #f5f3ff 50%, #fffbeb 100%);">
  
  <!-- خريطة العالم في الخلفية -->
  <div class="position-absolute top-0 start-0 w-100 h-100 opacity-[0.08]" 
       style="background-image: url('imtripo/map.png.png'); 
              background-size: cover; 
              background-position: center; 
              background-repeat: no-repeat;">
  </div>
  
  <!-- المحتوى -->
  <div class="position-relative z-1">
    <!-- اللوجو -->
    <h1 class="display-2 fw-bold mb-4" style="font-family: 'Segoe UI', sans-serif;">
      <span style="color: #2563eb;">tript</span><span style="color: #fbbf24; position: relative;">o</span>
    </h1>
    
    <!-- الجملة -->
    <p class="fs-4 mb-4" style="color: #1e40af;">Find your perfect stay in every city.</p>
    
    <!-- Loading Spinner -->
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem; border-width: 3px;">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>s
